<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RuralDoc AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #ecfeff, #f0fdf4);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0f172a;
    }

    .app {
      width: 100%;
      max-width: 420px;
      height: 90vh;
      background: white;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      padding: 18px;
      background: linear-gradient(135deg, #10b981, #14b8a6);
      color: white;
      font-weight: 700;
      font-size: 18px;
      text-align: center;
      letter-spacing: 0.5px;
    }

    .chat {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #f8fafc;
    }

    .bubble {
      max-width: 85%;
      padding: 12px 14px;
      border-radius: 16px;
      line-height: 1.4;
      font-size: 14px;
      white-space: pre-wrap;
    }

    .user {
      align-self: flex-end;
      background: #10b981;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .ai {
      align-self: flex-start;
      background: white;
      border: 1px solid #e5e7eb;
      border-bottom-left-radius: 4px;
    }

    .thinking {
      display: flex;
      gap: 6px;
      padding: 10px 14px;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      width: fit-content;
    }

    .dot {
      width: 6px;
      height: 6px;
      background: #10b981;
      border-radius: 50%;
      animation: blink 1.4s infinite both;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0% { opacity: 0.2; }
      20% { opacity: 1; }
      100% { opacity: 0.2; }
    }

    .input-area {
      padding: 12px;
      display: flex;
      gap: 8px;
      border-top: 1px solid #e5e7eb;
      background: white;
    }

    textarea {
      flex: 1;
      resize: none;
      border-radius: 12px;
      border: 1px solid #d1d5db;
      padding: 10px;
      font-size: 14px;
      outline: none;
      height: 44px;
    }

    button {
      background: #10b981;
      border: none;
      color: white;
      border-radius: 12px;
      padding: 0 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    button:active {
      transform: scale(0.96);
    }
  </style>
</head>

<body>

<div class="app">
  <div class="header">RuralDoc AI</div>

  <div id="chat" class="chat">
    <div class="bubble ai">
      Hello 👋 I’m RuralDoc AI.  
      Describe your symptoms and I’ll guide you.
    </div>
  </div>

  <div class="input-area">
    <textarea id="input" placeholder="Type your symptoms..."></textarea>
    <button onclick="send()">Send</button>
  </div>
</div>

<script>
  const chat = document.getElementById("chat");
  const input = document.getElementById("input");

  function addBubble(text, type) {
    const div = document.createElement("div");
    div.className = "bubble " + type;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function addThinking() {
    const div = document.createElement("div");
    div.className = "thinking";
    div.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  async function send() {
    const text = input.value.trim();
    if (!text) return;

    input.value = "";
    addBubble(text, "user");

    const thinking = addThinking();

    try {
      const res = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text })
      });

      const data = await res.json();
      thinking.remove();
      addBubble(data.text || "No response", "ai");
    } catch (e) {
      thinking.remove();
      addBubble("Something went wrong. Please try again.", "ai");
    }
  }
</script>

</body>
</html>
